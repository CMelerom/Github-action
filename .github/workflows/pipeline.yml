name: Pipeline CICD v2

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: helm-gh-runner 
    
    steps:
      - uses: actions/checkout@v3

      - name: Connect
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
        
      - name: Build
        run: docker build -t ${{ secrets.DOCKER_USER }}/app-suma:v1 .

      - name: Push
        run: docker push ${{ secrets.DOCKER_USER }}/app-suma:v1