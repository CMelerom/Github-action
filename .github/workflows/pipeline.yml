name: Pipeline CICD v2

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: helm-gh-runner 
    
    steps:
      - uses: actions/checkout@v3
        
      - name: Build
        run: docker build -t localhost:5000/app-suma:v1 .

      - name: Push
        run: docker push localhost:5000/app-suma:v1