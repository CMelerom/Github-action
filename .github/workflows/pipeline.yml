name: Pipeline CICD

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: helm-gh-runner 
    
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: docker build -t 192.168.49.1:5000/app-suma:v1 .

      - name: Push
        run: docker push 192.168.49.1:5000/app-suma:v1