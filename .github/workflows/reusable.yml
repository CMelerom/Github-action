name: Reusable CI Workflow
on: workflow_call

inputs:
      image:
        required: true
        type: string
      deployment:
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_TOKEN:
        required: true
      KUBE_CONFIG:
        required: true

jobs:
  deploy:
    runs-on: helm-gh-runner
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/${{ inputs.image }}:v1 .
          docker push ${{ secrets.DOCKER_USER }}/${{ inputs.image }}:v1

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy
        run: |
          kubectl apply -f deployment.yaml --insecure-skip-tls-verify
          kubectl rollout restart deployment/${{ inputs.deployment }} -n arc --insecure-skip-tls-verify